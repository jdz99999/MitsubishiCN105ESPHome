substitutions:
  name: "hp-living-room"
  friendly_name: Living Room Climate

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

 
esp8266:
  board: d1_mini



mqtt:  
  broker: home-io.local
  username: heatpumpLivingRoom
  password: !secret mqtt_password
  discovery: true



# Enable logging
logger:  
  hardware_uart: UART1
  level: INFO
  logs:
    EVT_SETS : INFO
    WIFI : INFO
    MQTT : INFO
    WRITE_SETTINGS : INFO
    SETTINGS : INFO
    STATUS : INFO
    CN105Climate: WARN
    CN105: INFO
    climate: WARN
    sensor: WARN
    chkSum : INFO
    WRITE : WARN
    READ : WARN
    Header: INFO
    Decoder : INFO
    CONTROL_WANTED_SETTINGS: INFO
  # level: DEBUG
  # logs:
  #   EVT_SETS : DEBUG
  #   WIFI : INFO
  #   MQTT : INFO
  #   WRITE_SETTINGS : DEBUG
  #   SETTINGS : DEBUG
  #   STATUS : INFO
  #   CN105Climate: WARN
  #   CN105: DEBUG
  #   climate: WARN
  #   sensor: WARN
  #   chkSum : INFO
  #   WRITE : WARN
  #   READ : WARN
  #   Header: INFO
  #   Decoder : DEBUG
  #   CONTROL_WANTED_SETTINGS: DEBUG

# Enable Home Assistant API
api:
  services:
    - service: reboot
      then:
        - logger.log: "Restarting..."
        - lambda: |-
            ESP.restart();
    - service: set_remote_temperature
      variables:
        temperature: float
      then:
        - lambda: 'id(climate_living_room).set_remote_temperature(temperature);'

    - service: use_internal_temperature
      then:
        - lambda: 'id(climate_living_room).set_remote_temperature(0);'
  encryption:
    key: !secret encryption_key

ota:  
- platform: esphome
  password: !secret ota_pwd
wifi:
  #ssid: !secret wifi_ssid
  #password: !secret wifi_password
  
  networks:
  - ssid : !secret wifi_ssid
    password: !secret wifi_password
  - ssid: !secret wifi_ssid2
    password: !secret wifi_password2
  #- ssid: !secret wifi_ssid2
  #  password: !secret wifi_password2

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Heatpump-Living-Room Fallback Hotspot"
    password: !secret ota_pwd

captive_portal:

# Not enough flash space for OTA updates.
#web_server:
#  port: 80
  
time:
  - platform: homeassistant
    id: homeassistant_time

# this setting is for local component (code is not on github)
external_components:
 - source:
     type: local
     path: ../../components 


# this setting is for github component 
# external_components:
#  - source: github://echavet/MitsubishiCN105ESPHome
#    refresh: 0s


        # Text sensors with general information.
text_sensor:
  # Expose ESPHome version as sensor.
  - platform: version
    name: ${name} ESPHome Version
  # Expose WiFi information as sensors.
  - platform: wifi_info
    ip_address:
      name: ${name} IP
    ssid:
      name: ${name} SSID
    bssid:
      name: ${name} BSSID

# Sensors with general information.
sensor:
  # Uptime sensor.
  - platform: uptime
    name: ${name} Uptime

  # WiFi Signal sensor.
  - platform: wifi_signal
    name: ${name} WiFi Signal
    update_interval: 60s
  
uart:
  id: HP_UART
  baud_rate: 2400
  tx_pin: 1
  rx_pin: 3
  
# Climate entity configuration
climate:
  - platform: cn105  # Replace with the platform of your choice.
    name: ${friendly_name}
    id: "climate_living_room"
    update_interval: 2s         # shouldn't be less than 1 second
    # horizontal_vane_select:
    #   name: ${name} Horizontal Vane
    #   id: "climate_living_room_horizontal_vane"
    vertical_vane_select:
      name: ${name} Vertical Vane
      id: "climate_living_room_vertical_vane"
    compressor_frequency_sensor:
      name: ${name} Compressor Frequency
      id: "climate_living_room_compressor_frequency"
    
    # Switch entity configuration
switch:
  - platform: template
    name: ${name} UART Setup Switch
    id: uart_setup_switch
    #setup_priority : -100.0 ## late
    optimistic: true
    turn_on_action:
      - lambda: |-
          // Call setupUART when the switch is turned on.
          id(climate_living_room).setupUART();
    turn_off_action:
      - lambda: |-
          // Disconnect UART when the switch is turned off.
          id(climate_living_room).disconnectUART();

  - platform: template
    name: Send 1st packet to ${name}
    id: send_packet_switch
    #setup_priority : -100.0 ## late
    optimistic: true
    turn_on_action:
      - lambda: |-          
          id(climate_living_room).sendFirstConnectionPacket();
  
  # - platform: template
  #   name: Requests ${name} Synchro
  #   id: build_and_send_requests_info_packets
  #   #setup_priority : -100.0 ## late
  #   optimistic: true    
